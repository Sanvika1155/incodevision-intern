<html>
<head>
<title>CALCULATOR</title>
<meta charset="UTF-8">
<meta name="viewport">
<style>
@media all and (min-width:500px){
body{
margin:30px;
}
}
button{ color:white;
 width:60px;
border-radius:4px;
text-align="center";
font-size:17px;
font-family: arial,courier,serif,sans-serif,"Times New Roman";
padding:10px;
background-color:hsl(0,0%,30%);

}

#display{border-style:solid;
width:256px;
height:90px;
border-color:black;
border-radius:5px;
padding:4px;
font-family: arial,courier,serif,sans-serif,"Times New Roman";
courser:pointer;
background-color:hsl(0,0%,40%);
color:white;
font-weight:bold;
font-size:35px;
}
.clear{
background-color:tomato;
color:white;
text-align="center";
width:121px;

}
.equal{
background-color:tomato;
color:white;
text-align="center";

}
.calculator{
display: grid;
grid-template-columns:repeat(2.1,1fr);
padding:5px;

}

.btn{
background-color:black;
width:252px;
padding:5.5px;
border-radius:5px;

}
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" autofocus required><br><br>
<span class="btn">
<button onclick="clearDisplay()" class="clear">clear</button>
<button onclick="appendvalue('+/-')">+/-</button>
<button onclick="appendvalue('/')">/</button>
<br><br>
<button onclick="appendvalue('7')">7</button>
<button onclick="appendvalue('8')">8</button>
<button onclick="appendvalue('9')">9</button>
<button onclick="appendvalue('*')">*</button>
<br>
<br>

<button onclick="appendvalue('4')">4</button>
<button onclick="appendvalue('5')">5</button>
<button onclick="appendvalue('6')">6</button>
<button onclick="appendvalue('-')">-</button>
<br>
<br>

<button onclick="appendvalue('3')">3</button>
<button onclick="appendvalue('2')">2</button>
<button onclick="appendvalue('1')">1</button>
<button onclick="appendvalue('+')">+</button><br><br>

<button onclick="appendvalue('%')">%</button>
<button onclick="appendvalue('0')">0</button>
<button onclick="appendvalue('.')">.</button>
<button onclick="calculate()" class="equal">=</button>
</span></div>
<script>
const display=document.getElementById("display")

function appendvalue(input)
{
display.value +=input;
}

function clearDisplay()
{
display.value= "";
}

function calculate()
{
display.value= eval(display.value);
}


</script>
</body>
</html>
